name: odoo-bom-local

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo-local
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  odoo:
    image: odoo:19.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo-local
    volumes:
      - ./vendor/odoo/odoo:/usr/lib/python3/dist-packages/odoo:ro
      - ./vendor/odoo/addons:/mnt/extra-addons:ro
      - ./.local/odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo-data:/var/lib/odoo
    command: ["odoo", "-d", "odoo_bom", "--db-filter=^odoo_bom$", "--no-database-list"]

volumes:
  postgres-data:
  odoo-data:
